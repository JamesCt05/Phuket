          },
          {
            time: "15:00 น.",
            title: "จุดชมวิวเครื่องบิน หาดไม้ขาว",
            category: "ไฮไลท์ถ่ายรูปใกล้สนามบิน",
            desc: "นั่งซาเล้งเข้าไปริมหาด ถ่ายรูปคู่กับเครื่องบินที่กำลังแลนดิ้งระยะประชิด",
            icon: "fa-plane",
            color: "text-sky-500 bg-sky-50",
            query: "Mai Khao Beach Plane Spotting Phuket"
          },
          {
            time: "16:30 น.",
            title: "เติมน้ำมัน & คืนรถเช่า สนามบินภูเก็ต",
            category: "คืนรถเช่า",
            desc: "เติมน้ำมันเต็มถังก่อนถึงสนามบิน ส่งมอบรถเช่าและตรวจรับเงินมัดจำคืน",
            icon: "fa-gas-pump",
            color: "text-rose-500 bg-rose-50",
            query: "Phuket International Airport Car Rental Return"
          },
          {
            time: "17:00 น.",
            title: "เช็กอินเที่ยวบินขากลับ (19:00 น.)",
            category: "เดินทางกลับ",
            desc: "เช็กอิน โหลดกระเป๋า ผ่านจุดตรวจค้น เพื่อเตรียมบินกลับอย่างสบายใจ",
            icon: "fa-plane-departure",
            color: "text-blue-600 bg-blue-50",
            query: "Phuket International Airport Domestic Departure"
          }
        ]
      }
    };

    function renderDay(day) {
      const data = tripData[day];
      document.getElementById('day-title').innerText = data.title;
      document.getElementById('day-desc').innerText = data.hotel;
      document.getElementById('route-map-btn').href = data.routeUrl;

      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      data.stops.forEach((stop) => {
        const navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.query)}`;
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center hover:shadow-md transition";
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${stop.color}">
              <i class="fa-solid ${stop.icon}"></i>
            </div>
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${stop.time}</span>
                <span class="text-xs text-teal-600 font-medium">${stop.category}</span>
              </div>
              <h3 class="font-bold text-base text-slate-800 mt-1">${stop.title}</h3>
              <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">${stop.desc}</p>
            </div>
          </div>
          <div class="w-full sm:w-auto shrink-0 pt-2 sm:pt-0">
            <a href="${navUrl}" target="_blank" class="w-full sm:w-auto inline-flex items-center justify-center bg-slate-100 hover:bg-teal-50 hover:text-teal-700 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl border border-slate-200 transition">
              <i class="fa-solid fa-location-arrow mr-1.5 text-teal-600"></i> นำทาง (Google Maps)
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchDay(day) {
      document.querySelectorAll('.day-tab').forEach((tab, index) => {
        if (index + 1 === day) {
          tab.className = "day-tab px-4 py-2 rounded-xl text-sm font-semibold transition bg-teal-600 text-white shrink-0 shadow-sm";
        } else {
          tab.className = "day-tab px-4 py-2 rounded-xl text-sm font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0";
        }
      });
      renderDay(day);
    }

    // Initialize Day 1
    renderDay(1);
  </script>
